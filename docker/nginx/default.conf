# default.conf — адаптированная версия
# Upstream для Node.js сервера
upstream node_backend_ai {
    server app:3000;            # внутри Docker-сети обращаемся к сервису app
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Основной домен: проксирование на Node.js с поддержкой HTTP/2 и HTTP/3
server {
    # TCP (HTTP/2) and QUIC (HTTP/3) listeners
    listen 443 ssl http2;
    # HTTP/3 requires nginx built with QUIC. "quic" and "reuseport" may be needed.
    listen 443 quic reuseport;

    server_name ваш-сервер2.ru www.ваш-сервер2.ru;

    # Пути к сертификатам — должны быть смонтированы в контейнере:
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL настройки: минимально — TLSv1.3 для HTTP/3
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Advertise HTTP/3 to clients via Alt-Svc and expose QUIC status header
    add_header Alt-Svc 'h3=" :443"; ma=86400' always;
    add_header QUIC-Status $quic;

    location / {
        proxy_pass http://node_backend_ai;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Catch-all для неизвестных доменов (отдаёт 444)
server {
    listen 443 ssl http2;
    listen 443 quic reuseport;

    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 444;
}
