<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Планировка двухкомнатной квартиры">
  <style>
    .wall { fill: none; stroke: #1B2028; stroke-width: 7; }
    .part { fill: none; stroke: #1B2028; stroke-width: 4; }
    .room { fill: #F3F5F8; }
    .name { font: 500 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2B313B; }
    .door { fill: none; stroke: #F3F5F8; stroke-width: 6; }
    .mark { font: 400 10px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #9AA1AC; }
  </style>
  <rect x="20" y="20" width="360" height="260" class="room" />
  <rect x="20" y="20" width="360" height="260" class="wall" />

  <path class="part" d="M200 20 V170 M200 170 H380 M20 190 H200 M120 190 V280" />
  <path class="door" d="M200 96 v34 M262 170 h34 M96 190 h34 M120 236 v30" />

  <text class="name" x="46" y="106">Гостиная</text>
  <text class="name" x="226" y="106">Спальня</text>
  <text class="name" x="256" y="234">Кухня</text>

  <text class="name" x="34" y="244">Прихожая</text>
  <text class="name" x="142" y="244">С/у</text>

  <text class="mark" x="24" y="294">Планировка показана схематично</text>
</svg>
