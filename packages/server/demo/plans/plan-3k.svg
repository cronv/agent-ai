<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Планировка трёхкомнатной квартиры">
  <style>
    .wall { fill: none; stroke: #1B2028; stroke-width: 7; }
    .part { fill: none; stroke: #1B2028; stroke-width: 4; }
    .room { fill: #F3F5F8; }
    .name { font: 500 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2B313B; }
    .door { fill: none; stroke: #F3F5F8; stroke-width: 6; }
    .mark { font: 400 10px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #9AA1AC; }
  </style>
  <rect x="20" y="20" width="360" height="260" class="room" />
  <rect x="20" y="20" width="360" height="260" class="wall" />

  <path class="part" d="M160 20 V280 M160 150 H380 M280 150 V280 M20 200 H160 M270 20 V150" />
  <path class="door" d="M160 74 v34 M160 216 v34 M228 150 h36 M280 220 v34 M96 200 h36 M270 60 v34" />

  <text class="name" x="34" y="106">Гостиная</text>
  <text class="name" x="184" y="100">Спальня</text>
  <text class="name" x="296" y="100">Спальня</text>

  <text class="name" x="186" y="230">Кухня</text>
  <text class="name" x="306" y="230">С/у</text>

  <text class="name" x="34" y="248">Прихожая</text>

  <text class="mark" x="24" y="294">Планировка показана схематично</text>
</svg>
