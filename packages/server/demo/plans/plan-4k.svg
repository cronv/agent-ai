<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Планировка четырёхкомнатной квартиры">
  <style>
    .wall { fill: none; stroke: #1B2028; stroke-width: 7; }
    .part { fill: none; stroke: #1B2028; stroke-width: 4; }
    .room { fill: #F3F5F8; }
    .name { font: 500 12px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #2B313B; }
    .door { fill: none; stroke: #F3F5F8; stroke-width: 6; }
    .mark { font: 400 10px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #9AA1AC; }
  </style>
  <rect x="20" y="20" width="360" height="260" class="room" />
  <rect x="20" y="20" width="360" height="260" class="wall" />

  <path class="part" d="M150 20 V280 M270 20 V150 M150 150 H380 M270 150 V280 M20 210 H150 M90 210 V280" />
  <path class="door" d="M150 70 v32 M270 70 v32 M204 150 h34 M324 150 h34 M150 226 v34 M52 210 h30 M90 244 v28" />

  <text class="name" x="30" y="102">Гостиная</text>
  <text class="name" x="170" y="94">Спальня</text>
  <text class="name" x="290" y="94">Спальня</text>

  <text class="name" x="170" y="222">Детская</text>
  <text class="name" x="296" y="222">Кухня</text>

  <text class="name" x="26" y="254">Холл</text>
  <text class="name" x="102" y="254">С/у</text>

  <text class="mark" x="24" y="294">Планировка показана схематично</text>
</svg>
